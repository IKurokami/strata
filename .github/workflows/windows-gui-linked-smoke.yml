name: Windows GTK linked executable smoke

# No paths filter: build.rs, data/**, .cargo/** and toolchain inputs can
# change Win32 compilation or linking even when src/** is untouched.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-gui-linked-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Link Windows strata.exe and run executable
    runs-on: windows-2025
    timeout-minutes: 80
    # Unlike the old compile-only diagnostic, failure of any step here is
    # a real failing CI check. We never claim the GUI runs on a successful
    # cargo check alone.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Windows GTK4 build and runtime libraries
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-vulkan-headers

      - name: Verify the native UCRT64 toolchain
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rustc -vV
          cargo -V
          pkgconf --modversion gtk4
          pkgconf --modversion gtksourceview-5
          pkgconf --modversion gstreamer-1.0
          gst-inspect-1.0 autoaudiosink
          pkgconf --modversion poppler-glib
          # Pass the actual MSYS2 location to native PowerShell steps.
          echo "STRATA_UCRT_ROOT=$(cygpath -w /ucrt64)" >> "$GITHUB_ENV"

      - name: Build and verify the private Windows IME runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:STRATA_UCRT_ROOT\bin;$env:Path"
          & .\scripts\windows\build-gtk-runtime.ps1 `
            -BuildRoot (Join-Path $env:RUNNER_TEMP 'strata-gtk-build') `
            -Destination '.\target\windows-gtk-runtime' -UcrtRoot $env:STRATA_UCRT_ROOT -Jobs 2
          & .\scripts\windows\test-gtk-runtime.ps1 `
            -GtkDll '.\target\windows-gtk-runtime\libgtk-4-1.dll' `
            -Output (Join-Path $env:RUNNER_TEMP 'strata-ime-probes') -UcrtRoot $env:STRATA_UCRT_ROOT
          New-Item -ItemType Directory -Path '.\target\debug' -Force | Out-Null
          Copy-Item '.\target\windows-gtk-runtime\libgtk-4-1.dll' '.\target\debug\libgtk-4-1.dll'
          Copy-Item '.\target\windows-gtk-runtime\libgstplay-1.0-0.dll' '.\target\debug\libgstplay-1.0-0.dll'

      - name: Compile and LINK the Windows GUI binary
        shell: msys2 {0}
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          cargo build --locked --no-default-features --features rar --bins
          test -s target/debug/strata.exe
          test -s target/debug/strata-shell.exe
          echo 'The Windows PE executable exists and linked successfully.'

      - name: Run executable version smoke test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          output="$(./target/debug/strata.exe --version)"
          printf '%s\n' "$output"
          case "$output" in
            *Strata*|*strata*) ;;
            *) echo 'Unexpected version response'; exit 1 ;;
          esac
          echo 'Windows strata.exe executed successfully under UCRT64.'

      - name: Run isolated Windows first-paint GUI smoke
        shell: pwsh
        env:
          STRATA_SMOKE_OUTPUT: ${{ runner.temp }}\strata-windows-gui-smoke.json
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:STRATA_UCRT_ROOT\bin;$env:Path"
          & .\scripts\windows\gui-smoke.ps1 -Executable .\target\debug\strata.exe -WorkingDirectory $env:GITHUB_WORKSPACE -OutputJson $env:STRATA_SMOKE_OUTPUT
          if (!(Test-Path -LiteralPath $env:STRATA_SMOKE_OUTPUT)) {
            throw 'GUI smoke did not write timing evidence'
          }

      - name: Upload Windows GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: strata-windows-gui-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strata-windows-gui-smoke.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Measure Windows first-paint baseline
        shell: pwsh
        env:
          STRATA_BENCHMARK_OUTPUT: ${{ runner.temp }}\strata-windows-gui-benchmark.json
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:STRATA_UCRT_ROOT\bin;$env:Path"
          & .\scripts\windows\gui-benchmark.ps1 -Executable .\target\debug\strata.exe -WorkingDirectory $env:GITHUB_WORKSPACE -OutputJson $env:STRATA_BENCHMARK_OUTPUT -Samples 5

      - name: Upload Windows first-paint baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: strata-windows-gui-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strata-windows-gui-benchmark.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Windows native Shell and filesystem regressions
        shell: msys2 {0}
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/strata-win-shell/Cargo.toml --locked --all-targets -- --test-threads=1
          cargo test --manifest-path crates/strata-native-io/Cargo.toml --locked --all-targets -- --test-threads=1

      - name: Compile all Windows GUI unit tests
        shell: msys2 {0}
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features --features rar --bin strata --bin strata-shell --no-run --message-format=json-render-diagnostics > target/windows-gui-test-artifacts.jsonl
          cp target/windows-gtk-runtime/libgtk-4-1.dll target/debug/deps/
          cp target/windows-gtk-runtime/libgstplay-1.0-0.dll target/debug/deps/

      - name: Verify live Shell preferences on a private desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:STRATA_UCRT_ROOT\bin;$env:Path"
          $artifacts = Get-Content target/windows-gui-test-artifacts.jsonl | ForEach-Object { $_ | ConvertFrom-Json }
          $tests = @($artifacts | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable -and $_.target.name -eq 'strata' })
          if ($tests.Count -ne 1) { throw 'Expected exactly one compiled GUI test harness' }
          python scripts/windows/private-test-desktop.py --log target/windows-shell-preferences.log -- $tests[0].executable 'ui::windows_integration::tests::' --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helpers = @($artifacts | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable -and $_.target.name -eq 'strata-shell' })
          if ($helpers.Count -ne 1) { throw 'Expected exactly one helper test harness' }
          python scripts/windows/private-test-desktop.py --log target/windows-helper-preferences.log -- $helpers[0].executable 'preferences::tests::' --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows-only safety and filesystem tests
        shell: msys2 {0}
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features --features rar --bin strata -- --list > target/windows-test-inventory.txt
          # Each case must really exist. A 0-tests result is not a pass.
          test -s scripts/windows/regression-tests.txt
          while IFS= read -r name; do
            name="${name%$'\r'}"
            if ! grep -Fq "${name}: test" target/windows-test-inventory.txt; then
              echo "Windows-only regression test missing: ${name}" >&2
              exit 1
            fi
            cargo test --locked --no-default-features --features rar --bin strata "${name}" -- --test-threads=1
          done < scripts/windows/regression-tests.txt

      - name: Package self-contained Windows portable release and test without MSYS2 PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\windows\package-release.ps1 `
            -Executable '.\target\debug\strata.exe' `
            -UcrtRoot $env:STRATA_UCRT_ROOT `
            -Destination (Join-Path $env:RUNNER_TEMP 'Strata-Windows-Portable')
          $zip = Join-Path $env:RUNNER_TEMP 'strata-windows-portable.zip'
          Compress-Archive -Path (Join-Path $env:RUNNER_TEMP 'Strata-Windows-Portable\*') `
            -DestinationPath $zip -CompressionLevel Optimal -Force
          if (!(Test-Path -LiteralPath $zip)) {
            throw 'Portable Windows archive missing'
          }
          Write-Host "Self-contained Windows portable release: $zip"

      - name: Upload self-contained Windows portable release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: strata-windows-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strata-windows-portable.zip
          if-no-files-found: error
          retention-days: 7

      - name: Record portable release provenance
        if: success()
        shell: msys2 {0}
        run: |
          cat > target/debug/WINDOWS-PORTABLE-RELEASE.txt <<'NOTE'
          Strata Windows self-contained portable release.
          The package includes the recursive native DLL closure, GTK/GStreamer
          resources, bundled FFmpeg tools, and a release-manifest.json hash list.
          The GUI smoke and native regression steps ran on this same build.
          NOTE

      - name: Upload linked executable for portable release evaluation
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: strata-windows-linked-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/debug/strata.exe
            target/debug/WINDOWS-PORTABLE-RELEASE.txt
          if-no-files-found: error
          retention-days: 7
